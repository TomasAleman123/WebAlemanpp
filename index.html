<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Alemanpp - Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- ================= HEADER (POST LOGIN) ================= -->
  <header id="appHeader" class="app-header" style="display:none;">
    <h1 id="headerWelcome">Bienvenido</h1>
  </header>

  <!-- ================= MAIN (POST LOGIN) ================= -->
  <main id="mainContent" class="main-content" style="display:none;">
    
    <div class="tasks-container">
      <button id="logoutMain" class="header-logout-button logout-absolute">
        Cerrar Sesión
      </button>

      <h2 class="tasks-title">Mis Tareas</h2>

      <!-- AGREGAR TAREA -->
      <div class="tasks-input">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="Escribí una nueva tarea"
        >
        <button id="addTaskBtn">Agregar</button>
      </div>

      <!-- LISTA DE TAREAS -->
      <ul id="taskList" class="tasks-list"></ul>
    </div>

  </main>

  <!-- ================= BIENVENIDA ================= -->
  <div id="welcomeScreen" class="welcome-container">
    <div class="welcome-content">

      <svg class="welcome-logo" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="95" fill="none" stroke="#1e3a5f" stroke-width="12"/>
        <text x="50" y="140" font-size="80" font-weight="bold" fill="#1e3a5f">TA</text>
      </svg>

      <p class="project-title">Proyecto de Intensificación de Saberes</p>
      <h1 class="welcome-title">Web Alemanpp</h1>
      <p class="author-name">Tomás Aleman</p>

      <button id="nextButton" class="welcome-button">Siguiente</button>
    </div>
  </div>

  <!-- ================= ELECCIÓN ================= -->
  <div id="choiceScreen" class="choice-container" style="display:none;">
    <div class="choice-content">
      <h2 class="choice-title">Bienvenido a Web Alemanpp</h2>
      <p class="choice-subtitle">¿Qué deseas hacer?</p>

      <button id="loginChoiceBtn" class="choice-button">Iniciar Sesión</button>
      <button id="registerChoiceBtn" class="choice-button">Registrarse</button>
    </div>
  </div>

  <!-- ================= LOGIN ================= -->
  <div id="loginScreen" class="login-container" style="display:none;">
    <form id="loginForm">
      <h1 class="form-title">Iniciar Sesión</h1>

      <div class="form-group">
        <label>Correo o Usuario</label>
        <input type="text" id="email" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required>
      </div>

      <button type="submit">Ingresar</button>

      <div class="link-container">
        <a href="#" id="backToChoice">Volver</a>
      </div>
    </form>
  </div>

  <!-- ================= REGISTRO ================= -->
  <div id="registerScreen" class="register-container" style="display:none;">
    <form id="registerForm">
      <h1 class="form-title">Registrarse</h1>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="registerEmail" required>
      </div>

      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="registerUsername" required>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="registerPassword" required>
      </div>

      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input type="password" id="confirmPassword" required>
      </div>

      <button type="submit">Crear Cuenta</button>

      <div class="link-container">
        <a href="#" id="backToChoice2">Volver</a>
      </div>
    </form>
  </div>

  <!-- ================= MODAL LOGOUT ================= -->
  <div id="logoutModal" class="logout-modal" style="display:none;">
    <div class="logout-modal-content">
      <h2>¿Cerrar sesión?</h2>
      <div class="logout-modal-buttons">
        <button id="confirmLogout">Sí</button>
        <button id="cancelLogout">No</button>
      </div>
    </div>
  </div>

  <!-- ================= SCRIPTS ================= -->
  <script src="js/storage.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/login.js"></script>
  <script src="js/register.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/tareas.js"></script>

</body>
</html>
